<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title> Music Player</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeonEQ" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Flutemusic</span>
      </div>
      <div class="header-actions">
        <label class="btn-upload" title="Tambah lagu dari komputer">
          <input type="file" id="fileInput" accept="audio/*" multiple hidden />
          <span>＋ Tambah Lagu</span>
        </label>
      </div>
    </header>

    <main class="main">
      <!-- Left: Player + Visualizer -->
      <section class="player-section">
        <div class="album-art-wrap">
          <div class="album-art" id="albumArt">
            <div class="art-placeholder">♪</div>
            <canvas id="visualizer" width="320" height="320"></canvas>
          </div>
          <div class="glow-ring"></div>
        </div>

        <div class="track-info">
          <h1 class="track-title" id="trackTitle">Pilih lagu...</h1>
          <p class="track-artist" id="trackArtist">—</p>
        </div>

        <div class="progress-wrap">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-thumb" id="progressThumb"></div>
          </div>
          <span class="time" id="duration">0:00</span>
        </div>

        <div class="controls">
          <button class="ctrl-btn mode-btn" id="btnShuffle" title="Shuffle">🔀</button>
          <button class="ctrl-btn" id="btnPrev" title="Previous">⏮</button>
          <button class="ctrl-btn play-btn" id="btnPlay" title="Play / Pause">▶</button>
          <button class="ctrl-btn" id="btnNext" title="Next">⏭</button>
          <button class="ctrl-btn mode-btn" id="btnRepeat" title="Repeat">🔁</button>
        </div>

        <!-- Volume Knob -->
        <div class="volume-section">
          <div class="knob-group">
            <div class="knob-3d volume-knob" data-param="volume" data-min="0" data-max="1" data-value="0.8">
              <div class="knob-body">
                <div class="knob-indicator"></div>
                <div class="knob-center"></div>
              </div>
              <div class="knob-shadow"></div>
            </div>
            <span class="knob-label">VOLUME</span>
          </div>
        </div>
      </section>

      <!-- Right: Equalizer -->
      <section class="eq-section">
        <div class="eq-header">
          <h2>EQUALIZER</h2>
          <button class="btn-reset" id="btnResetEQ">Reset</button>
        </div>

        <div class="eq-knobs" id="eqKnobs">
          <!--  JS -->
        </div>

        <div class="eq-presets">
          <button class="preset-btn" data-preset="flat">Flat</button>
          <button class="preset-btn" data-preset="bass">Bass Boost</button>
          <button class="preset-btn" data-preset="treble">Treble</button>
          <button class="preset-btn" data-preset="vocal">Vocal</button>
          <button class="preset-btn" data-preset="rock">Rock</button>
        </div>
      </section>
    </main>

    <!-- Playlist -->
    <aside class="playlist-section">
      <h3>PLAYLIST <span id="trackCount">0</span></h3>
      <ul class="playlist" id="playlist"></ul>
      <p class="hint">“Tambah Lagu”</p>
    </aside>
  </div>

  <script src="js/Player.js"></script>
  <script>
    // Register  (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('NeonEQ PWA ready'))
          .catch(err => console.log('SW failed:', err));
      });
    }
  </script>
</body>
</html>
